<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061019">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Anatomy Lens</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#061019;
  --panel:rgba(8,20,32,.86);
  --line:rgba(159,216,255,.16);
  --text:#e3f2fc;
  --muted:#84a2b8;
  --film:#9fd8ff;
  --film-ink:#04121d;
  --chip:#0f2234;
  --bone:#efe6d2;
  --font:"IBM Plex Sans Condensed", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel:rgba(241,246,250,.92); --line:rgba(16,48,78,.16); --text:#0b1c2b;
    --muted:#4c6578; --chip:#dfe9f2; --film:#1d6fa8; --film-ink:#ffffff; color-scheme:light;
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; overscroll-behavior:none; font-family:var(--font); }
button,input{ font:inherit; color:inherit; }
button:focus-visible,input:focus-visible{ outline:2px solid var(--film); outline-offset:2px; }
#view{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; background:#000; }
#gl{ position:fixed; inset:0; width:100%; height:100%; display:none; pointer-events:none; }
body.v3d{ background:radial-gradient(120% 75% at 50% 35%, #12304a 0%, #061019 72%); }
body.v3d #gl{ display:block; }
body.v3d #view{ background:transparent; }
body:not(.v3d) .only3d, body.v3d .onlyAR{ display:none; }
body:not(.secview) .secOnly{ display:none; }
.credit{ position:fixed; left:16px; right:16px; top:calc(env(safe-area-inset-top,0px) + 112px); z-index:4; font-size:11px; line-height:1.35; color:#9fb9cc; pointer-events:none; display:none; max-width:46ch; }
body.v3d.real3d .credit{ display:block; }
.card3d{ position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); z-index:7; max-height:46vh; overflow:auto; background:var(--panel);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:18px; padding:14px 16px 12px; color:var(--text); box-shadow:0 10px 30px rgba(0,0,0,.35); }
.card3d[hidden]{ display:none; }
.card3d h3{ margin:2px 36px 2px 0; font-size:21px; font-weight:600; line-height:1.15; }
.cardsys{ font-size:12px; color:var(--film); }
.cardpart{ font-size:12px; color:var(--muted); margin-bottom:8px; }
.card3d dl{ margin:0; display:grid; grid-template-columns:1fr; gap:2px; }
.card3d dt{ font-size:12px; color:var(--muted); margin-top:6px; }
.card3d dd{ margin:0; font-size:14.5px; line-height:1.4; }
.cardx{ position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:17px; border:1px solid var(--line); background:var(--chip); color:var(--text); cursor:pointer; }
.actp{ position:fixed; left:12px; top:calc(env(safe-area-inset-top,0px) + 150px); z-index:4; width:min(240px,62vw); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px; pointer-events:none; }
.actp[hidden]{ display:none; }
.actp h5{ margin:0 0 6px; font-size:12px; font-weight:600; color:#ffb14a; }
.actp p{ margin:6px 0 0; font-size:10.5px; color:var(--muted); line-height:1.3; }
.arow{ display:grid; grid-template-columns:1fr 54px 34px; align-items:center; gap:6px; font-size:12.5px; margin:3px 0; }
.arow b{ height:6px; border-radius:3px; background:linear-gradient(90deg,#ff8a1f var(--w),rgba(255,255,255,.12) var(--w)); }
.arow i{ font-style:normal; text-align:right; color:var(--muted); font-size:11.5px; }
.iconbtn.on{ background:var(--film); color:var(--film-ink); border-color:transparent; }
.secondary{ width:100%; height:50px; margin-top:10px; border-radius:25px; border:1px solid rgba(159,216,255,.45); background:transparent; color:#cfe8fa; font-size:16px; font-weight:600; cursor:pointer; }
#video{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
.flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:20; transition:opacity .35s; }
.flash.on{ opacity:.8; transition:none; }

.top{ position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 14px;
  background:linear-gradient(to bottom, rgba(6,16,25,.8), rgba(6,16,25,0)); pointer-events:none; }
.top > *{ pointer-events:auto; }
.brand{ flex:1; min-width:0; color:#e3f2fc; }
.brand b{ display:block; font-size:19px; font-weight:600; letter-spacing:.01em; }
.brand span{ font-size:12px; color:#9fb9cc; }
.iconbtn{ min-width:42px; height:42px; border-radius:21px; border:1px solid var(--line); background:var(--panel);
  color:var(--text); font-size:18px; display:grid; place-items:center; cursor:pointer; padding:0 12px; }
.iconbtn.txt{ font-size:13px; font-weight:600; }

.status{ position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top,0px) + 68px); z-index:5;
  padding:6px 12px; border-radius:999px; background:var(--panel); border:1px solid var(--line);
  font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.status[hidden]{ display:none; }
.dot{ width:7px; height:7px; border-radius:50%; background:#f0c36a; }
.dot.ok{ background:#73e2ab; box-shadow:0 0 8px #73e2ab; }

.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--panel);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border-top:1px solid var(--line);
  border-radius:22px 22px 0 0; padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 10px);
  max-height:64vh; display:flex; flex-direction:column; }
.sheet-head{ display:flex; align-items:center; gap:8px; padding:6px 0 4px; }
.quick{ flex:1; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.quick::-webkit-scrollbar{ display:none; }
.chip{ flex:none; height:36px; padding:0 14px; border-radius:18px; border:1px solid var(--line); background:var(--chip); cursor:pointer; font-size:14px; }
.chip.on{ background:var(--film); color:var(--film-ink); border-color:transparent; font-weight:600; }
.sheet-body{ display:none; overflow:auto; padding:6px 0 4px; }
.sheet.open .sheet-body{ display:block; }
.group{ padding:10px 0; border-top:1px solid var(--line); }
.group h4{ margin:0 0 8px; font-size:13px; font-weight:500; color:var(--muted); }
.seg{ display:flex; background:var(--chip); border-radius:12px; padding:3px; gap:3px; }
.seg button{ flex:1; height:34px; border:0; border-radius:9px; background:transparent; cursor:pointer; font-size:14px; }
.seg button.on{ background:var(--film); color:var(--film-ink); font-weight:600; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.toggles{ display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
.tog{ display:flex; align-items:center; gap:9px; min-height:36px; font-size:14.5px; cursor:pointer; }
.tog input{ width:20px; height:20px; accent-color:var(--film); }
.range{ display:grid; grid-template-columns:1fr 1.2fr; align-items:center; gap:10px; min-height:38px; font-size:14px; }
.range input{ width:100%; accent-color:var(--film); }
.hint{ font-size:12.5px; color:var(--muted); line-height:1.45; margin:8px 0 2px; }

.start{ position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:24px;
  background:radial-gradient(120% 80% at 50% 30%, #0c2236 0%, #061019 70%); }
.start[hidden]{ display:none; }
.card{ max-width:420px; width:100%; color:#e3f2fc; }
.card .mark{ width:120px; height:120px; margin:0 0 20px; }
.card h1{ margin:0 0 10px; font-size:38px; line-height:1.05; font-weight:600; letter-spacing:-.01em; }
.card p{ margin:0 0 18px; font-size:16px; line-height:1.5; color:#b5cddd; }
.primary{ width:100%; height:54px; border:0; border-radius:27px; background:#9fd8ff; color:#04121d; font-size:17px; font-weight:600; cursor:pointer; }
.primary:disabled{ opacity:.6; }
.note{ font-size:12.5px !important; color:#7e9aae !important; margin-top:16px !important; }
.err{ color:#ff9a9a !important; font-size:14px !important; }
.langsw{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px; }
@media (prefers-reduced-motion: reduce){ .flash{ transition:none; } .start .mark .spin, .start .mark .spinr{ animation:none !important; } }
/* ===== holographic HUD theme ===== */
.scanfx{ display:none; }
body.hud{ --bg:#01080f; --panel:rgba(2,18,28,.76); --line:rgba(0,229,255,.34); --text:#d9fbff; --muted:#74b9c8; --film:#00e5ff; --film-ink:#00151d; --chip:rgba(0,229,255,.06); color-scheme:dark; }
body.hud .scanfx{ display:block; position:fixed; inset:0; z-index:3; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,229,255,.03) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,10,18,.55) 100%); }
body.hud.v3d{ background:radial-gradient(90% 60% at 50% 45%, #06283a 0%, #020d16 60%, #01060b 100%); }
body.hud.v3d::before{ content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(0,229,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.07) 1px, transparent 1px); background-size:32px 32px; }
body.hud .brand b{ font-family:'Rajdhani',var(--font); font-weight:700; font-size:17px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e9fdff; text-shadow:0 0 14px rgba(0,229,255,.65); }
body.hud .brand span{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
body.hud .brand span{ font-family:'Share Tech Mono',ui-monospace,monospace; color:#5fd9ef; letter-spacing:.06em; text-transform:uppercase; font-size:11px; }
body.hud .iconbtn{ border-radius:4px; background:rgba(2,22,34,.7); border-color:rgba(0,229,255,.45); color:#bff6ff; box-shadow:0 0 12px rgba(0,229,255,.15) inset;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); font-family:'Rajdhani',var(--font); }
body.hud .iconbtn.on{ background:#00e5ff; color:#00151d; box-shadow:0 0 18px rgba(0,229,255,.7); }
body.hud .status{ border-radius:2px; font-family:'Share Tech Mono',ui-monospace,monospace; text-transform:uppercase; letter-spacing:.06em; font-size:11.5px; color:#9ff0ff;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%); padding:6px 18px; }
body.hud .dot.ok{ background:#00e5ff; box-shadow:0 0 10px #00e5ff; }
body.hud .sheet{ border-radius:0; border-top:1px solid rgba(0,229,255,.5); box-shadow:0 -10px 34px rgba(0,229,255,.1);
  clip-path:polygon(0 16px,16px 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%); }
body.hud .chip{ border-radius:2px; font-family:'Rajdhani',var(--font); font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:13.5px; border-color:rgba(0,229,255,.4); }
body.hud .chip.on{ background:#00e5ff; color:#00151d; box-shadow:0 0 14px rgba(0,229,255,.6); }
body.hud .seg{ border-radius:2px; background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.18); }
body.hud .seg button{ border-radius:1px; font-family:'Rajdhani',var(--font); font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
body.hud .seg button.on{ background:#00e5ff; color:#00151d; box-shadow:0 0 10px rgba(0,229,255,.55); }
body.hud .group h4, body.hud .cardsys, body.hud .actp h5{ font-family:'Share Tech Mono',ui-monospace,monospace; text-transform:uppercase; letter-spacing:.08em; font-size:11px; }
body.hud .card3d, body.hud .actp{ border-radius:0; border-color:rgba(0,229,255,.45); box-shadow:0 0 24px rgba(0,229,255,.14), 0 0 1px rgba(0,229,255,.8) inset;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
body.hud .card3d h3{ font-family:'Rajdhani',var(--font); font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#eafdff; text-shadow:0 0 12px rgba(0,229,255,.5); }
body.hud .card3d dt{ font-family:'Share Tech Mono',ui-monospace,monospace; text-transform:uppercase; letter-spacing:.06em; color:#38d5ee; font-size:11px; }
body.hud .actp h5{ color:#ffb347; }
body.hud .credit{ font-family:'Share Tech Mono',ui-monospace,monospace; font-size:10px; color:#4fb6ca; }
body.hud .start{ background:radial-gradient(90% 60% at 50% 35%, #072c40 0%, #020d16 65%, #01060b 100%); }
body.hud .card h1{ font-family:'Rajdhani',var(--font); font-weight:700; text-transform:uppercase; letter-spacing:.12em; text-shadow:0 0 18px rgba(0,229,255,.6); }
body.hud .primary{ border-radius:2px; background:#00e5ff; color:#00151d; font-family:'Rajdhani',var(--font); font-weight:700; letter-spacing:.14em; text-transform:uppercase; box-shadow:0 0 22px rgba(0,229,255,.45);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); }
body.hud .secondary{ border-radius:2px; font-family:'Rajdhani',var(--font); font-weight:600; letter-spacing:.12em; text-transform:uppercase; border-color:rgba(0,229,255,.55); color:#aef4ff; }
.start .mark .spin{ transform-origin:60px 60px; animation:spin 14s linear infinite; } .start .mark .spinr{ transform-origin:60px 60px; animation:spin 9s linear infinite reverse; }
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="view"></canvas>
<div class="flash" id="flash"></div>
<div class="scanfx" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><b data-i="title">Anatomy Lens</b><span data-i="subtitle">Live anatomy overlay</span></div>
  <button class="iconbtn txt" id="lang" aria-label="Language">IT</button>
  <button class="iconbtn" id="flip" aria-label="Switch camera">⇄</button>
  <button class="iconbtn txt" id="v3d" aria-label="3D view">3D</button>
  <button class="iconbtn" id="snap" aria-label="Take photo">📸</button>
</header>

<div class="credit" id="credit3d" data-i="credit3d"></div>
<div class="actp" id="actP" hidden><h5 data-i="actTitle">Active muscles</h5><div id="actL"></div><p data-i="actNote"></p></div>
<section class="card3d" id="card3d" hidden aria-live="polite"><button class="cardx" id="cardX" aria-label="Close">✕</button><div class="cardsys" id="cardSys"></div><h3 id="cardT"></h3><div class="cardpart" id="cardP"></div><dl id="cardD"></dl></section>
<div class="status" id="status" hidden><span class="dot" id="sdot"></span><span id="stext"></span></div>

<section class="sheet" id="sheet">
  <div class="sheet-head">
    <div class="quick">
      <button class="chip" data-preset="all" data-i="all">Everything</button>
      <button class="chip" data-preset="bones" data-i="bones">Bones</button>
      <button class="chip" data-preset="muscles" data-i="muscles">Muscles</button>
      <button class="chip" data-preset="organs" data-i="organs">Organs</button>
      <button class="chip" data-preset="skin" data-i="skinChip">Skin</button>
    </div>
    <button class="iconbtn" id="more" aria-label="Settings" aria-expanded="false">⚙︎</button>
  </div>
  <div class="sheet-body">
    <div class="group only3d">
      <h4 data-i="view3d">3D view</h4>
      <div style="margin-bottom:10px"><h4 data-i="section">Layout</h4><div class="seg" data-seg="section"><button data-v="full" data-i="sFull">Full</button><button data-v="atlas" data-i="sAtlas">Atlas</button><button data-v="cut" data-i="sCut">Section</button><button data-v="mri" data-i="sMri">MRI</button></div></div>
      <div class="secOnly" style="margin-bottom:10px"><h4 data-i="plane">Plane</h4><div class="seg" data-seg="plane"><button data-v="axial" data-i="pAx">Axial</button><button data-v="coronal" data-i="pCor">Coronal</button><button data-v="sagittal" data-i="pSag">Sagittal</button></div>
        <label class="range"><span data-i="slice">Slice position</span><input type="range" id="slice" min="0" max="1000"></label>
        <p class="hint" data-i="sliceHint"></p></div>
      <div class="row2">
        <div><h4 data-i="pose3d">Pose</h4><div class="seg" data-seg="pose3d"><button data-v="live" data-i="live">Live</button><button data-v="freeze" data-i="freeze">Freeze</button></div></div>
        <div><h4 data-i="spin">Auto-spin</h4><div class="seg" data-seg="spin"><button data-v="off" data-i="off">Off</button><button data-v="on" data-i="on">On</button></div></div>
      </div>
      <div class="row2" style="margin-top:10px">
        <div><h4 data-i="focus">Focus</h4><div class="seg" data-seg="focus"><button data-v="body" data-i="fBody">Body</button><button data-v="torso" data-i="fTorso">Torso</button><button data-v="head" data-i="fHead">Head</button></div></div>
        <div><h4 data-i="inset">Camera inset</h4><div class="seg" data-seg="inset"><button data-v="off" data-i="off">Off</button><button data-v="on" data-i="on">On</button></div></div>
      </div>
      <p class="hint" data-i="hint3d"></p>
    </div>
    <div class="group onlyAR">
      <div class="row2">
        <div><h4 data-i="reveal">Reveal</h4>
          <div class="seg" data-seg="reveal"><button data-v="lens" data-i="lens">Lens</button><button data-v="all" data-i="whole">Whole body</button></div></div>
        <div><h4 data-i="follow">Lens follows</h4>
          <div class="seg" data-seg="follow"><button data-v="finger" data-i="finger">Fingertip</button><button data-v="touch" data-i="touch">Touch</button></div></div>
      </div>
      <p class="hint" data-i="hint"></p>
    </div>
    <div class="group">
      <h4 data-i="layers">Layers</h4>
      <div class="toggles">
        <label class="tog"><input type="checkbox" data-layer="skeleton"><span data-i="skeleton">Skeleton</span></label>
        <label class="tog"><input type="checkbox" data-layer="skull"><span data-i="skull">Skull</span></label>
        <label class="tog"><input type="checkbox" data-layer="hands"><span data-i="hands">Hand bones</span></label>
        <label class="tog"><input type="checkbox" data-layer="muscles"><span data-i="muscleL">Muscles</span></label>
        <label class="tog"><input type="checkbox" data-layer="organs"><span data-i="organL">Organs</span></label>
        <label class="tog"><input type="checkbox" data-layer="brain"><span data-i="brain">Brain</span></label>
        <label class="tog only3d"><input type="checkbox" data-layer="shell"><span data-i="shell">Skin silhouette</span></label>
        <label class="tog"><input type="checkbox" data-layer="skin"><span data-i="skin">Face skin check</span></label>
        <label class="tog"><input type="checkbox" data-layer="labels"><span data-i="labels">Labels</span></label>
      </div>
    </div>
    <div class="group">
      <div class="row2">
        <div><h4 data-i="quality">Tracking</h4>
          <div class="seg" data-seg="quality"><button data-v="high" data-i="high">Stable</button><button data-v="fast" data-i="fast">Fast</button></div></div>
        <div><h4 data-i="density">Labels shown</h4>
          <div class="seg" data-seg="density"><button data-v="key" data-i="key">Main ones</button><button data-v="all" data-i="every">All</button></div></div>
      </div>
      <p class="hint" data-i="skinNote"></p>
    </div>
    <div class="group">
      <h4 data-i="look">Look</h4>
      <div class="seg" data-seg="look"><button data-v="holo" data-i="holo">Hologram</button><button data-v="xray" data-i="xray">X-ray</button><button data-v="solid" data-i="solid">Solid</button></div>
      <div style="margin:10px 0 4px"><h4 data-i="theme">Style</h4><div class="seg" data-seg="theme"><button data-v="hud" data-i="tHud">Holographic</button><button data-v="classic" data-i="tClassic">Classic</button></div></div>
      <label class="range"><span data-i="real">Real me showing through</span><input type="range" id="real" min="0" max="100"></label>
      <label class="range"><span data-i="brightness">Brightness</span><input type="range" id="brightness" min="40" max="200"></label>
      <label class="range"><span data-i="lensSize">Lens size</span><input type="range" id="lensSize" min="15" max="48"></label>
      <label class="range"><span data-i="zoom">Zoom</span><input type="range" id="zoom" min="10" max="25"></label>
    </div>
    <p class="hint" data-i="disclaimer"></p>

<script>

/* ---------- bones ---------- */

function ball(P,r,o){ if(!okP(P)||!(r>0.5)) return; base(); c.beginPath(); c.arc(P.x,P.y,r,0,TAU); paint("bone",Object.assign({grad:radialG("bone",P.x,P.y,r,o)},o||{})); }

/* ---------- muscles ---------- */

 [/frontal (gyrus|lobe|pole)|precentral|orbital gyr|gyrus rectus|frontal operculum/,"ner",["Lobo frontale","Pianificazione, decisioni, autocontrollo, movimento volontario; a sinistra di solito anche la produzione del linguaggio (area di Broca).","Il lobo più grande, circa un terzo della corteccia.","Arterie cerebrali anteriore e media.","Traumi cranici, demenza frontotemporale, ictus."],
  ["Frontal lobe","Planning, decisions, self-control and voluntary movement; on the left, usually speech production (Broca’s area).","The largest lobe, about a third of the cortex.","Anterior and middle cerebral arteries.","Head injury, frontotemporal dementia, stroke."]],
 [/parietal|postcentral|supramarginal|angular gyrus|precuneus/,"ner",["Lobo parietale","Tatto, senso della posizione del corpo, orientamento nello spazio e calcolo.","Dietro il solco centrale, sotto il vertice del cranio.","Arterie cerebrali media e anteriore.","Neglect spaziale dopo ictus."],
  ["Parietal lobe","Touch, body position sense, spatial orientation and calculation.","Behind the central sulcus, under the top of the skull.","Middle and anterior cerebral arteries.","Spatial neglect after stroke."]],
 [/temporal (gyrus|lobe|pole)|transverse temporal|fusiform|parahippocampal/,"ner",["Lobo temporale","Udito, memoria, riconoscimento dei volti; a sinistra di solito la comprensione del linguaggio (area di Wernicke).","Ai lati del cervello, dietro le tempie.","Arteria cerebrale media.","Epilessia temporale, afasia."],
  ["Temporal lobe","Hearing, memory and face recognition; on the left, usually language comprehension (Wernicke’s area).","On each side of the brain, behind the temples.","Middle cerebral artery.","Temporal lobe epilepsy, aphasia."]],
 [/occipital (gyr|lobe|pole)|cuneus|lingual gyrus|calcarine/,"ner",["Lobo occipitale","Elabora la vista: forme, colori, movimento.","Nella parte posteriore del cervello.","Arteria cerebrale posteriore.","Cecità corticale, emianopsia dopo ictus."],
  ["Occipital lobe","Processes vision: shape, colour and motion.","At the back of the brain.","Posterior cerebral artery.","Cortical blindness, hemianopia after stroke."]],
 [/insula/,"ner",["Insula","Consapevolezza delle sensazioni del corpo, gusto, emozioni.","Nascosta in profondità nel solco laterale.","Arteria cerebrale media.","Ictus dell’arteria cerebrale media."],["Insula","Awareness of body sensations, taste and emotions.","Hidden deep in the lateral sulcus.","Middle cerebral artery.","Middle cerebral artery stroke."]],
 [/gyrus|gyri|lobule|cerebral cortex/,"ner",["Corteccia cerebrale","Lo strato esterno del cervello: pensiero, linguaggio, percezione, movimento.","Spessa 2–4 mm; il cervello intero pesa circa 1,3–1,4 kg con circa 86 miliardi di neuroni.","Arterie cerebrali anteriore, media e posteriore.","Ictus, demenze, epilessia."],
  ["Cerebral cortex","The outer layer of the brain: thought, language, perception, movement.","2–4 mm thick; the whole brain weighs about 1.3–1.4 kg with about 86 billion neurons.","Anterior, middle and posterior cerebral arteries.","Stroke, dementia, epilepsy."]],
 [/pituitary|hypophysis/,"end",["Ipofisi","La “ghiandola maestra”: regola tiroide, surreni, crescita e riproduzione.","Circa 1 cm, pesa meno di 1 g.","Arterie ipofisarie.","Adenomi ipofisari."],["Pituitary gland","The “master gland”: regulates thyroid, adrenals, growth and reproduction.","About 1 cm, weighs under 1 g.","Hypophyseal arteries.","Pituitary adenomas."]],
 [/eyeball|optic nerve/,"ner",["Occhio","Trasforma la luce in segnali nervosi per la vista.","Diametro circa 24 mm, peso circa 7,5 g.","Arteria oftalmica; nervo ottico (II).","Miopia, cataratta, glaucoma, degenerazione maculare."],["Eye","Turns light into nerve signals for vision.","About 24 mm across, about 7.5 g.","Ophthalmic artery; optic nerve (II).","Myopia, cataract, glaucoma, macular degeneration."]],
 /* ---- heart & vessels ---- */
 [/coronary/,"car",["Arterie coronarie","Portano sangue ossigenato al muscolo del cuore.","Diametro di 3–4 mm all’origine; destra e sinistra (discendente anteriore e circonflessa).","Nascono dall’aorta subito sopra la valvola aortica.","Aterosclerosi, angina, infarto."],["Coronary arteries","Carry oxygen-rich blood to the heart muscle.","3–4 mm wide at the origin; right and left (anterior descending and circumflex).","Arise from the aorta just above the aortic valve.","Atherosclerosis, angina, heart attack."]],
 [/wall of heart|ventricle of heart|atrium|valve|papillary|heart/,"car",["Cuore","Pompa il sangue in due circuiti: ai polmoni e a tutto il corpo.","Peso 250–350 g, grande circa come un pugno; a riposo 60–100 battiti al minuto e circa 5 litri di sangue al minuto.","Arterie coronarie; nervi vago e simpatici.","Infarto, aritmie (es. fibrillazione atriale), valvulopatie, scompenso."],
  ["Heart","Pumps blood around two circuits: to the lungs and to the whole body.","Weighs 250–350 g, about the size of a fist; at rest 60–100 beats per minute and about 5 litres of blood per minute.","Coronary arteries; vagus and sympathetic nerves.","Heart attack, arrhythmias (e.g. atrial fibrillation), valve disease, heart failure."]],
 [/aorta|aortic/,"car",["Aorta","L’arteria principale: porta il sangue dal cuore a tutto il corpo.","Diametro di circa 2,5–3,5 cm all’origine, lunga circa 30–40 cm fino al bacino.","Dà origine a tutte le grandi arterie del corpo.","Aneurisma, dissezione, aterosclerosi."],["Aorta","The main artery: carries blood from the heart to the whole body.","About 2.5–3.5 cm wide at its root, about 30–40 cm long down to the pelvis.","Gives rise to all the body’s large arteries.","Aneurysm, dissection, atherosclerosis."]],
 [/vena cava/,"car",["Vena cava","Riporta il sangue povero di ossigeno all’atrio destro: superiore dalla parte alta del corpo, inferiore da quella bassa.","Diametro circa 2 cm.","Raccoglie le grandi vene del corpo.","Trombosi, sindrome della vena cava superiore."],["Vena cava","Returns oxygen-poor blood to the right atrium: superior from the upper body, inferior from the lower body.","About 2 cm wide.","Collects the body’s large veins.","Thrombosis, superior vena cava syndrome."]],
 [/pulmonary (artery|trunk)/,"car",["Arteria polmonare","Porta il sangue povero di ossigeno dal cuore ai polmoni.","Tronco di circa 3 cm di diametro.","Dal ventricolo destro.","Embolia polmonare, ipertensione polmonare."],["Pulmonary artery","Carries oxygen-poor blood from the heart to the lungs.","Trunk about 3 cm wide.","From the right ventricle.","Pulmonary embolism, pulmonary hypertension."]],
 [/vein/,"car",["Vena","Riporta il sangue al cuore; molte vene degli arti hanno valvole che impediscono il reflusso.","Parete sottile, pressione bassa.","—","Trombosi venosa, varici."],["Vein","Carries blood back to the heart; many limb veins have valves that stop backflow.","Thin wall, low pressure.","—","Venous thrombosis, varicose veins."]],
 [/artery|arterial|trunk/,"car",["Arteria","Porta il sangue ricco di ossigeno dal cuore agli organi.","Parete spessa ed elastica, pressione alta.","—","Aterosclerosi, aneurismi."],["Artery","Carries oxygen-rich blood from the heart to the organs.","Thick, elastic wall, high pressure.","—","Atherosclerosis, aneurysms."]],
 /* ---- respiratory ---- */
 [/lobe of .*lung|lung/,"res",["Polmone","Scambia i gas: l’ossigeno entra nel sangue e l’anidride carbonica esce.","Destro con 3 lobi, sinistro con 2; circa 300–500 milioni di alveoli e circa 6 L di capacità totale nell’adulto.","Arterie e vene polmonari; nervo vago.","Polmonite, asma, BPCO, tumore del polmone."],["Lung","Exchanges gases: oxygen enters the blood and carbon dioxide leaves it.","Right has 3 lobes, left 2; about 300–500 million alveoli and about 6 L total capacity in adults.","Pulmonary arteries and veins; vagus nerve.","Pneumonia, asthma, COPD, lung cancer."]],
 [/trachea/,"res",["Trachea","Il condotto che porta l’aria dalla laringe ai bronchi.","Lunga 10–12 cm, larga circa 2 cm, con 16–20 anelli di cartilagine a C.","Arterie tiroidee inferiori; nervo vago.","Tracheite, stenosi."],["Trachea","The airway that carries air from the larynx to the bronchi.","10–12 cm long, about 2 cm wide, with 16–20 C-shaped cartilage rings.","Inferior thyroid arteries; vagus nerve.","Tracheitis, stenosis."]],
 [/bronch/,"res",["Bronchi","Si ramificano dentro i polmoni per distribuire l’aria fino agli alveoli.","Circa 23 livelli di ramificazione.","Arterie bronchiali.","Bronchite, asma."],["Bronchi","Branch inside the lungs to deliver air to the alveoli.","About 23 levels of branching.","Bronchial arteries.","Bronchitis, asthma."]],
 [/thyroid cartilage|cricoid|larynx|epiglott|arytenoid/,"res",["Laringe","Contiene le corde vocali; protegge le vie aeree quando si deglutisce. La cartilagine tiroidea forma il “pomo d’Adamo”.","Lunga circa 4–5 cm.","Arterie laringee; nervi laringei (rami del vago).","Laringite, noduli alle corde vocali."],["Larynx","Holds the vocal cords and protects the airway when swallowing. The thyroid cartilage forms the “Adam’s apple”.","About 4–5 cm long.","Laryngeal arteries; laryngeal nerves (branches of the vagus).","Laryngitis, vocal cord nodules."]],
 [/nasal cartilage|nose/,"res",["Cartilagini del naso","Danno forma alla punta e alle ali del naso.","Cartilagine flessibile.","Arteria facciale.","Deviazione del setto."],["Nasal cartilages","Shape the tip and wings of the nose.","Flexible cartilage.","Facial artery.","Deviated septum."]],
 /* ---- digestive ---- */
 [/gallbladder|cystic duct|bile duct/,"dig",["Cistifellea","Immagazzina e concentra la bile prodotta dal fegato.","Contiene circa 30–50 mL di bile.","Arteria cistica.","Calcoli biliari, colecistite."],["Gallbladder","Stores and concentrates the bile made by the liver.","Holds about 30–50 mL of bile.","Cystic artery.","Gallstones, cholecystitis."]],
 [/liver|hepatic/,"dig",["Fegato","L’organo interno più grande: produce la bile, regola gli zuccheri, produce proteine, elimina sostanze tossiche.","Pesa circa 1,4–1,6 kg; riceve circa il 75% del sangue dalla vena porta.","Arteria epatica e vena porta.","Fegato grasso, epatiti, cirrosi."],["Liver","The largest internal organ: makes bile, regulates sugar, makes proteins and removes toxins.","Weighs about 1.4–1.6 kg; gets about 75% of its blood from the portal vein.","Hepatic artery and portal vein.","Fatty liver, hepatitis, cirrhosis."]],
 [/pancrea/,"dig",["Pancreas","Produce enzimi digestivi e gli ormoni insulina e glucagone.","Lungo circa 15 cm, pesa 70–100 g.","Arterie pancreaticoduodenali e splenica.","Diabete, pancreatite, tumore del pancreas."],["Pancreas","Makes digestive enzymes and the hormones insulin and glucagon.","About 15 cm long, weighs 70–100 g.","Pancreaticoduodenal and splenic arteries.","Diabetes, pancreatitis, pancreatic cancer."]],
 [/esophag/,"dig",["Esofago","Porta il cibo dalla gola allo stomaco con onde di contrazione.","Lungo circa 25 cm.","Rami dell’aorta e arterie gastriche; nervo vago.","Reflusso gastroesofageo, esofagite."],["Esophagus","Carries food from the throat to the stomach with waves of contraction.","About 25 cm long.","Aortic branches and gastric arteries; vagus nerve.","Reflux disease, esophagitis."]],
 [/stomach|pylor|cardia/,"dig",["Stomaco","Mescola il cibo con acido ed enzimi e lo passa lentamente all’intestino.","Capacità di circa 1–1,5 L; il succo gastrico ha pH 1,5–3,5.","Arterie gastriche; nervo vago.","Gastrite, ulcera, reflusso."],["Stomach","Mixes food with acid and enzymes and passes it slowly to the intestine.","Holds about 1–1.5 L; gastric juice has a pH of 1.5–3.5.","Gastric arteries; vagus nerve.","Gastritis, ulcer, reflux."]],
 [/duoden|jejun|ileum|small intestine/,"dig",["Intestino tenue","Dove si assorbe la maggior parte dei nutrienti: duodeno, digiuno, ileo.","Lungo circa 6–7 m (meno nell’intestino vivo); la superficie interna, con i villi, è molto ampia.","Arteria mesenterica superiore.","Celiachia, morbo di Crohn."],["Small intestine","Where most nutrients are absorbed: duodenum, jejunum, ileum.","About 6–7 m long (shorter in the living gut); villi give a very large inner surface.","Superior mesenteric artery.","Coeliac disease, Crohn’s disease."]],
 [/colon|cecum|caecum|rectum|appendix|large intestine|anal|taenia/,"dig",["Intestino crasso","Assorbe acqua e sali e ospita gran parte del microbiota intestinale.","Lungo circa 1,5 m.","Arterie mesenteriche superiore e inferiore.","Colon irritabile, diverticoli, appendicite, tumore del colon-retto."],["Large intestine","Absorbs water and salts and hosts most of the gut microbiota.","About 1.5 m long.","Superior and inferior mesenteric arteries.","Irritable bowel, diverticula, appendicitis, colorectal cancer."]],
 [/tooth|incisor|canine|molar/,"dig",["Dente","Taglia e macina il cibo; lo smalto è la sostanza più dura del corpo.","32 denti nell’adulto, 20 da latte.","Arterie alveolari; nervo trigemino.","Carie, parodontite."],["Tooth","Cuts and grinds food; enamel is the hardest substance in the body.","32 adult teeth, 20 baby teeth.","Alveolar arteries; trigeminal nerve.","Tooth decay, gum disease."]],
 [/tongue|pharyn|salivary|parotid|submandibular gland|palate|labial part of mouth|lip/,"dig",["Bocca e faringe","Masticazione, deglutizione, gusto e parola.","—","Arterie linguale e facciale.","Faringite, calcoli salivari."],["Mouth and pharynx","Chewing, swallowing, taste and speech.","—","Lingual and facial arteries.","Pharyngitis, salivary stones."]],
 /* ---- other organs ---- */
 [/spleen/,"lin",["Milza","Filtra il sangue, elimina i globuli rossi vecchi e aiuta le difese immunitarie.","Circa 12 cm, pesa circa 150 g.","Arteria splenica.","Splenomegalia, rottura nei traumi."],["Spleen","Filters blood, removes old red cells and supports immunity.","About 12 cm, weighs about 150 g.","Splenic artery.","Enlarged spleen, rupture in trauma."]],
 [/thymus/,"lin",["Timo","Fa maturare i linfociti T, importanti per le difese immunitarie.","Grande nell’infanzia, si riduce dopo la pubertà.","Arterie toraciche interne.","Timoma, miastenia."],["Thymus","Matures T lymphocytes, important for immunity.","Large in childhood, shrinks after puberty.","Internal thoracic arteries.","Thymoma, myasthenia gravis."]],
 [/adrenal|suprarenal/,"end",["Ghiandola surrenale","Produce cortisolo, aldosterone e adrenalina.","Pesa circa 4–5 g, sopra ogni rene.","Arterie surrenali.","Morbo di Addison, sindrome di Cushing."],["Adrenal gland","Makes cortisol, aldosterone and adrenaline.","Weighs about 4–5 g, on top of each kidney.","Adrenal arteries.","Addison’s disease, Cushing’s syndrome."]],
 [/thyroid gland/,"end",["Tiroide","Produce gli ormoni che regolano il metabolismo.","Pesa circa 15–25 g.","Arterie tiroidee.","Ipotiroidismo, ipertiroidismo, noduli."],["Thyroid gland","Makes the hormones that set the metabolic rate.","Weighs about 15–25 g.","Thyroid arteries.","Hypothyroidism, hyperthyroidism, nodules."]],
 [/kidney|renal/,"uri",["Rene","Filtra il sangue, produce l’urina e regola pressione e sali.","Lungo circa 11–12 cm, pesa circa 150 g; filtra circa 180 L di plasma al giorno e produce 1–2 L di urina.","Arteria e vena renale.","Calcoli renali, insufficienza renale, infezioni."],["Kidney","Filters the blood, makes urine and regulates blood pressure and salts.","About 11–12 cm long, about 150 g; filters about 180 L of plasma a day into 1–2 L of urine.","Renal artery and vein.","Kidney stones, kidney failure, infections."]],
 [/ureter/,"uri",["Uretere","Porta l’urina dal rene alla vescica.","Lungo 25–30 cm, largo pochi millimetri.","Rami delle arterie renali e iliache.","Coliche da calcoli."],["Ureter","Carries urine from the kidney to the bladder.","25–30 cm long, a few millimetres wide.","Branches of the renal and iliac arteries.","Colic from stones."]],
 [/bladder|urethra/,"uri",["Vescica","Raccoglie l’urina fino allo svuotamento.","Capacità di circa 400–600 mL; lo stimolo arriva di solito sopra i 150–300 mL.","Arterie vescicali.","Cistite, incontinenza."],["Bladder","Stores urine until it is emptied.","Holds about 400–600 mL; the urge usually starts above 150–300 mL.","Vesical arteries.","Cystitis, incontinence."]],
 [/^skin$/,"teg",["Pelle","Protegge dal mondo esterno, regola la temperatura, percepisce tatto e dolore.","L’organo più esteso: circa 1,5–2 m², spessore 0,5–4 mm.","Rete di piccoli vasi del derma.","Acne, dermatiti, tumori della pelle."],["Skin","Protects against the outside world, regulates temperature, senses touch and pain.","The largest organ: about 1.5–2 m², 0.5–4 mm thick.","Network of small dermal vessels.","Acne, dermatitis, skin cancers."]],
 /* ---- muscles ---- */
 [/diaphragm/,"mus",["Diaframma","Il principale muscolo del respiro: abbassandosi fa entrare l’aria nei polmoni.","Cupola che separa torace e addome.","Nervo frenico (C3–C5).","Singhiozzo, ernia iatale."],["Diaphragm","The main breathing muscle: as it moves down, air flows into the lungs.","Dome separating chest and abdomen.","Phrenic nerve (C3–C5).","Hiccups, hiatal hernia."]],
 [/intercostal/,"mus",["Muscoli intercostali","Tra le costole: aiutano ad alzare e abbassare la gabbia toracica nel respiro.","Tre strati in ogni spazio intercostale.","Nervi intercostali.","Strappi da tosse o sforzo."],["Intercostal muscles","Between the ribs: help raise and lower the rib cage when breathing.","Three layers in each rib space.","Intercostal nerves.","Strains from coughing or effort."]],
 [/deltoid/,"mus",["Deltoide","Solleva il braccio di lato, in avanti e indietro; dà la forma tonda alla spalla.","Tre fasci: anteriore, medio, posteriore.","Nervo ascellare (C5–C6).","Lesioni del nervo ascellare, sovraccarico."],["Deltoid","Lifts the arm sideways, forwards and backwards; gives the shoulder its round shape.","Three parts: front, middle, back.","Axillary nerve (C5–C6).","Axillary nerve injury, overuse."]],
 [/supraspinatus|infraspinatus|teres minor|subscapularis/,"mus",["Cuffia dei rotatori","Tiene la testa dell’omero centrata nella spalla e la ruota.","Quattro muscoli attorno alla scapola.","Nervi soprascapolare, ascellare e sottoscapolari.","Tendinite, rottura della cuffia."],["Rotator cuff","Keeps the head of the humerus centred in the shoulder and rotates it.","Four muscles around the shoulder blade.","Suprascapular, axillary and subscapular nerves.","Tendinitis, rotator cuff tear."]],
 [/pectoralis major/,"mus",["Grande pettorale","Porta il braccio verso il petto e in avanti, e lo ruota all’interno (spinte, abbracci).","Muscolo a ventaglio del petto.","Nervi pettorali mediale e laterale.","Strappi nella panca piana."],["Pectoralis major","Brings the arm across the chest and forward and rotates it inward (pushing, hugging).","Fan-shaped chest muscle.","Medial and lateral pectoral nerves.","Tears during bench press."]],
 [/pectoralis minor/,"mus",["Piccolo pettorale","Abbassa e porta in avanti la scapola.","Sotto il grande pettorale.","Nervo pettorale mediale.","Spalle in avanti, compressioni nervose."],["Pectoralis minor","Pulls the shoulder blade down and forward.","Under the pectoralis major.","Medial pectoral nerve.","Rounded shoulders, nerve compression."]],
 [/biceps brachii/,"mus",["Bicipite brachiale","Piega il gomito e gira il palmo verso l’alto (supinazione).","Due capi: lungo e breve.","Nervo muscolocutaneo (C5–C6).","Tendinite, rottura del tendine."],["Biceps brachii","Bends the elbow and turns the palm up (supination).","Two heads: long and short.","Musculocutaneous nerve (C5–C6).","Tendinitis, tendon rupture."]],
 [/brachialis|coracobrachialis/,"mus",["Brachiale","Il vero motore della flessione del gomito, sotto il bicipite.","—","Nervo muscolocutaneo.","Sovraccarico."],["Brachialis","The main elbow flexor, lying under the biceps.","—","Musculocutaneous nerve.","Overuse."]],
 [/triceps|anconeus/,"mus",["Tricipite brachiale","Distende il gomito (spinte, flessioni).","Tre capi: lungo, laterale, mediale.","Nervo radiale.","Tendinite."],["Triceps brachii","Straightens the elbow (pushing, push-ups).","Three heads: long, lateral, medial.","Radial nerve.","Tendinitis."]],
 [/brachioradialis/,"mus",["Brachioradiale","Piega il gomito con la mano a metà tra palmo su e giù (come reggere un bicchiere).","Lungo l’avambraccio, lato del pollice.","Nervo radiale.","Sovraccarico."],["Brachioradialis","Bends the elbow with the hand half-turned (like holding a glass).","Along the thumb side of the forearm.","Radial nerve.","Overuse."]],
 [/flexor (carpi|digitorum|pollicis)|palmaris|pronator/,"mus",["Flessori dell’avambraccio","Piegano polso e dita e chiudono la mano (presa).","Gruppo sul lato del palmo.","Nervi mediano e ulnare.","Epicondilite mediale (gomito del golfista), tunnel carpale."],["Forearm flexors","Bend the wrist and fingers and close the hand (grip).","Group on the palm side.","Median and ulnar nerves.","Medial epicondylitis (golfer’s elbow), carpal tunnel."]],
 [/extensor (carpi|digitorum|pollicis|indicis)|supinator|abductor pollicis longus/,"mus",["Estensori dell’avambraccio","Distendono polso e dita.","Gruppo sul dorso dell’avambraccio.","Nervo radiale.","Epicondilite laterale (gomito del tennista)."],["Forearm extensors","Straighten the wrist and fingers.","Group on the back of the forearm.","Radial nerve.","Lateral epicondylitis (tennis elbow)."]],
 [/rectus abdominis|linea alba|rectus sheath/,"mus",["Retto dell’addome","Piega il tronco in avanti e sostiene la parete addominale; è la “tartaruga”.","Diviso da 3–4 inserzioni tendinee; linea alba al centro.","Nervi intercostali T7–T12.","Diastasi dei retti, ernie."],["Rectus abdominis","Bends the trunk forward and supports the abdominal wall; the “six-pack”.","Divided by 3–4 tendinous bands; linea alba in the middle.","Intercostal nerves T7–T12.","Diastasis recti, hernias."]],
 [/oblique|transversus abdominis/,"mus",["Obliqui e trasverso","Ruotano e flettono il tronco di lato, stabilizzano il busto.","Tre strati della parete addominale.","Nervi intercostali e ileoipogastrico.","Strappi, ernie."],["Obliques and transversus","Twist and side-bend the trunk and stabilise the core.","Three layers of the abdominal wall.","Intercostal and iliohypogastric nerves.","Strains, hernias."]],
 [/serratus anterior/,"mus",["Dentato anteriore","Porta la scapola in avanti e la tiene contro il torace (pugno, spinta).","Digitazioni a sega sulle costole.","Nervo toracico lungo.","Scapola alata."],["Serratus anterior","Pulls the shoulder blade forward and holds it against the chest (punching, pushing).","Saw-tooth slips on the ribs.","Long thoracic nerve.","Winged scapula."]],
 [/latissimus|teres major/,"mus",["Gran dorsale","Porta il braccio in basso e indietro (trazioni, nuoto, remo).","Il muscolo più largo della schiena.","Nervo toracodorsale.","Strappi negli sport di trazione."],["Latissimus dorsi","Pulls the arm down and back (pull-ups, swimming, rowing).","The broadest back muscle.","Thoracodorsal nerve.","Strains in pulling sports."]],
 [/trapezius/,"mus",["Trapezio","Muove e stabilizza la scapola, solleva le spalle, estende il collo.","Tre parti: superiore, media, inferiore.","Nervo accessorio (XI).","Tensione cervicale, cefalea muscolo-tensiva."],["Trapezius","Moves and stabilises the shoulder blade, shrugs the shoulders, extends the neck.","Three parts: upper, middle, lower.","Accessory nerve (XI).","Neck tension, tension headache."]],
 [/rhomboid|levator scapulae/,"mus",["Romboidi ed elevatore della scapola","Avvicinano e sollevano la scapola.","Sotto il trapezio.","Nervo dorsale della scapola.","Dolore tra le scapole."],["Rhomboids and levator scapulae","Draw the shoulder blade in and up.","Under the trapezius.","Dorsal scapular nerve.","Pain between the shoulder blades."]],
 [/sternocleidomastoid/,"mus",["Sternocleidomastoideo","Gira la testa dal lato opposto e la piega in avanti.","Dallo sterno e clavicola fino all’osso dietro l’orecchio.","Nervo accessorio (XI).","Torcicollo."],["Sternocleidomastoid","Turns the head to the opposite side and bends it forward.","From breastbone and collarbone to the bone behind the ear.","Accessory nerve (XI).","Wry neck (torticollis)."]],
 [/scalen|longus (colli|capitis)|splenius|semispinalis capitis|sternothyroid|sternohyoid|omohyoid|thyrohyoid|digastric|mylohyoid|geniohyoid|platysma|stylohyoid|rectus capitis|obliquus capitis/,"mus",["Muscoli del collo","Muovono e sostengono testa e collo; gli scaleni aiutano il respiro profondo.","—","Nervi cervicali.","Cervicalgia."],["Neck muscles","Move and support head and neck; the scalenes help deep breathing.","—","Cervical nerves.","Neck pain."]],
 [/iliocostalis|longissimus|spinalis|multifidus|erector/,"mus",["Erettori della colonna","Tengono dritta la schiena e la estendono.","Colonne muscolari ai lati della spina dorsale.","Rami posteriori dei nervi spinali.","Lombalgia, contratture."],["Erector spinae","Hold the back upright and extend it.","Muscle columns on each side of the spine.","Posterior branches of the spinal nerves.","Low back pain, spasms."]],
 [/quadratus lumborum/,"mus",["Quadrato dei lombi","Inclina il tronco di lato e stabilizza il bacino.","—","Nervi T12–L4.","Lombalgia."],["Quadratus lumborum","Bends the trunk sideways and steadies the pelvis.","—","T12–L4 nerves.","Low back pain."]],
 [/gluteus maximus/,"mus",["Grande gluteo","Estende l’anca: alzarsi dalla sedia, salire le scale, correre.","Il muscolo più voluminoso del corpo.","Nervo gluteo inferiore.","Debolezza, dolore gluteo."],["Gluteus maximus","Extends the hip: standing up, climbing stairs, running.","The bulkiest muscle in the body.","Inferior gluteal nerve.","Weakness, buttock pain."]],
 [/gluteus (medius|minimus)|tensor fasciae/,"mus",["Medio e piccolo gluteo","Tengono il bacino orizzontale quando si sta su una gamba sola (camminata).","Sotto il grande gluteo.","Nervo gluteo superiore.","Andatura di Trendelenburg, tendinopatia."],["Gluteus medius and minimus","Keep the pelvis level when standing on one leg (walking).","Under the gluteus maximus.","Superior gluteal nerve.","Trendelenburg gait, tendinopathy."]],
 [/piriformis|obturator|gemellus|quadratus femoris/,"mus",["Extrarotatori dell’anca","Ruotano la coscia verso l’esterno.","Piccoli muscoli profondi dietro l’anca.","Rami del plesso sacrale.","Sindrome del piriforme."],["Hip external rotators","Turn the thigh outwards.","Small deep muscles behind the hip.","Sacral plexus branches.","Piriformis syndrome."]],
 [/iliacus|psoas/,"mus",["Ileopsoas","Il principale flessore dell’anca: porta la coscia in alto (camminare, salire).","Dalla colonna lombare e dal bacino al femore.","Nervo femorale e rami lombari.","Tendinite, contratture."],["Iliopsoas","The main hip flexor: lifts the thigh (walking, climbing).","From the lumbar spine and pelvis to the femur.","Femoral nerve and lumbar branches.","Tendinitis, tightness."]],
 [/rectus femoris|vastus|quadriceps/,"mus",["Quadricipite","Distende il ginocchio: alzarsi, salire, calciare, frenare in discesa.","Quattro capi: retto femorale e tre vasti.","Nervo femorale (L2–L4).","Contratture, tendinopatia rotulea."],["Quadriceps","Straightens the knee: standing up, climbing, kicking, braking downhill.","Four heads: rectus femoris and three vasti.","Femoral nerve (L2–L4).","Strains, patellar tendinopathy."]],
 [/biceps femoris|semitendinosus|semimembranosus/,"mus",["Ischiocrurali","Piegano il ginocchio ed estendono l’anca.","Tre muscoli dietro la coscia.","Nervo sciatico.","Strappi (frequenti negli scatti)."],["Hamstrings","Bend the knee and extend the hip.","Three muscles at the back of the thigh.","Sciatic nerve.","Strains (common in sprinting)."]],
 [/adductor|gracilis|pectineus/,"mus",["Adduttori","Avvicinano la coscia all’altra gamba e stabilizzano l’anca.","Gruppo all’interno della coscia.","Nervo otturatorio.","Pubalgia, stiramenti all’inguine."],["Adductors","Bring the thigh toward the other leg and steady the hip.","Group on the inner thigh.","Obturator nerve.","Groin strain, athletic pubalgia."]],
 [/sartorius/,"mus",["Sartorio","Flette e ruota l’anca e piega il ginocchio (sedersi a gambe incrociate).","Il muscolo più lungo del corpo.","Nervo femorale.","Raramente leso."],["Sartorius","Flexes and rotates the hip and bends the knee (sitting cross-legged).","The longest muscle in the body.","Femoral nerve.","Rarely injured."]],
 [/gastrocnemius|soleus|plantaris/,"mus",["Polpaccio (gastrocnemio e soleo)","Alza il tallone: camminare, saltare, stare in punta di piedi.","Si inserisce sul calcagno con il tendine d’Achille.","Nervo tibiale.","Crampi, strappi, tendinopatia achillea."],["Calf (gastrocnemius and soleus)","Lifts the heel: walking, jumping, standing on tiptoe.","Inserts on the heel bone through the Achilles tendon.","Tibial nerve.","Cramps, strains, Achilles tendinopathy."]],
 [/calcaneal tendon|achilles/,"mus",["Tendine d’Achille","Collega il polpaccio al calcagno; il tendine più robusto del corpo.","Lungo circa 15 cm.","Nervo tibiale (muscoli).","Tendinopatia, rottura."],["Achilles tendon","Links the calf to the heel bone; the strongest tendon in the body.","About 15 cm long.","Tibial nerve (muscles).","Tendinopathy, rupture."]],
 [/tibialis anterior|extensor (digitorum|hallucis) longus|fibularis tertius/,"mus",["Tibiale anteriore","Solleva la punta del piede ad ogni passo.","Davanti alla tibia.","Nervo peroneo profondo.","Piede cadente, periostite tibiale."],["Tibialis anterior","Lifts the front of the foot at every step.","In front of the shin.","Deep fibular nerve.","Foot drop, shin splints."]],
 [/fibularis|peroneus/,"mus",["Peronei","Ruotano la pianta del piede verso l’esterno e proteggono dalle distorsioni.","Sul lato esterno della gamba.","Nervo peroneo superficiale.","Distorsioni di caviglia."],["Fibularis (peroneal) muscles","Turn the sole outwards and protect against ankle sprains.","On the outer side of the leg.","Superficial fibular nerve.","Ankle sprains."]],
 [/masseter/,"mus",["Massetere","Chiude la mandibola: masticazione.","Tra i muscoli più potenti del corpo per forza rispetto alla dimensione.","Nervo trigemino (V3).","Bruxismo, disturbi dell’articolazione temporo-mandibolare."],["Masseter","Closes the jaw: chewing.","One of the strongest muscles for its size.","Trigeminal nerve (V3).","Teeth grinding, jaw joint disorders."]],
 [/temporalis/,"mus",["Muscolo temporale","Chiude e tira indietro la mandibola.","A ventaglio sulla tempia.","Nervo trigemino (V3).","Cefalea muscolo-tensiva, bruxismo."],["Temporalis","Closes and retracts the jaw.","Fan-shaped over the temple.","Trigeminal nerve (V3).","Tension headache, teeth grinding."]],
 [/frontalis|occipitofrontalis|epicranius/,"mus",["Muscolo frontale","Alza le sopracciglia e forma le rughe orizzontali della fronte.","Collegato alla galea aponeurotica.","Nervo facciale (VII).","Paralisi del facciale."],["Frontalis","Raises the eyebrows and makes horizontal forehead lines.","Joined to the galea aponeurotica.","Facial nerve (VII).","Facial nerve palsy."]],
 [/orbicularis oculi/,"mus",["Orbicolare dell’occhio","Chiude le palpebre; con l’età forma le zampe di gallina.","Anello attorno all’occhio.","Nervo facciale (VII).","Blefarospasmo, paralisi del facciale."],["Orbicularis oculi","Closes the eyelids; with age it forms crow’s feet.","Ring around the eye.","Facial nerve (VII).","Blepharospasm, facial palsy."]],
 [/orbicularis oris/,"mus",["Orbicolare della bocca","Chiude e arrotonda le labbra (bacio, fischio).","Anello attorno alla bocca.","Nervo facciale (VII).","Paralisi del facciale."],["Orbicularis oris","Closes and purses the lips (kissing, whistling).","Ring around the mouth.","Facial nerve (VII).","Facial palsy."]],
 [/zygomaticus|risorius|levator labii|depressor|buccinator|mentalis|nasalis|procerus|corrugator/,"mus",["Muscoli mimici","Creano le espressioni del viso: sorriso, smorfie, aggrottare.","Piccoli muscoli inseriti nella pelle.","Nervo facciale (VII).","Paralisi del facciale."],["Facial expression muscles","Create facial expressions: smiling, grimacing, frowning.","Small muscles attached to the skin.","Facial nerve (VII).","Facial palsy."]],
 [/rectus (superior|inferior|medialis|lateralis)|oblique of eyeball|superior oblique|inferior oblique|levator palpebrae/,"mus",["Muscoli dell’occhio","Muovono l’occhio e sollevano la palpebra.","Sei muscoli per occhio più l’elevatore della palpebra.","Nervi cranici III, IV, VI.","Strabismo, ptosi."],["Eye muscles","Move the eye and lift the eyelid.","Six muscles per eye plus the eyelid lifter.","Cranial nerves III, IV, VI.","Squint, drooping eyelid."]],
 [/muscle|tendon|aponeurosis|fascia/,"mus",["Muscolo scheletrico","Muove le ossa contraendosi; produce anche calore.","Nel corpo ci sono più di 600 muscoli, circa il 40% del peso.","—","Strappi, crampi, contratture."],["Skeletal muscle","Moves the bones by contracting; also produces heat.","The body has more than 600 muscles, about 40% of body weight.","—","Strains, cramps, spasms."]],
 /* ---- skeleton ---- */
 [/mandible/,"esq",["Mandibola","L’unico osso mobile del cranio: masticazione e parola.","Si articola con il temporale (articolazione temporo-mandibolare).","Arteria alveolare inferiore; nervo trigemino.","Fratture, disturbi temporo-mandibolari."],["Mandible","The only movable skull bone: chewing and speech.","Hinges on the temporal bone (jaw joint).","Inferior alveolar artery; trigeminal nerve.","Fractures, jaw joint disorders."]],
 [/frontal bone|parietal bone|occipital bone|temporal bone|sphenoid|ethmoid/,"esq",["Cranio","Protegge il cervello come una scatola rigida.","8 ossa del cranio e 14 della faccia, saldate da suture.","Arterie meningee.","Fratture, craniosinostosi nei neonati."],["Skull","Protects the brain like a rigid box.","8 cranial and 14 facial bones, joined by sutures.","Meningeal arteries.","Fractures, craniosynostosis in infants."]],
 [/zygomatic|maxilla|nasal bone|lacrimal|palatine|vomer|nasal concha/,"esq",["Ossa della faccia","Formano zigomi, mascella, naso e orbite.","14 ossa facciali.","Arterie mascellare e facciale.","Fratture facciali, sinusite (seni mascellari)."],["Facial bones","Form the cheekbones, upper jaw, nose and eye sockets.","14 facial bones.","Maxillary and facial arteries.","Facial fractures, sinusitis (maxillary sinuses)."]],
 [/hyoid/,"esq",["Osso ioide","Sostiene la lingua e la laringe; l’unico osso che non si articola con altre ossa.","A forma di U, nel collo.","—","Fratture rare."],["Hyoid bone","Supports the tongue and larynx; the only bone not jointed to another bone.","U-shaped, in the neck.","—","Rare fractures."]],
 [/atlas|axis|cervical vertebra/,"esq",["Vertebre cervicali","Sostengono e muovono la testa; C1 (atlante) e C2 (epistrofeo) permettono di annuire e ruotare.","7 vertebre.","Arterie vertebrali; nervi cervicali.","Colpo di frusta, ernie cervicali, artrosi."],["Cervical vertebrae","Support and move the head; C1 (atlas) and C2 (axis) allow nodding and turning.","7 vertebrae.","Vertebral arteries; cervical nerves.","Whiplash, cervical disc herniation, arthritis."]],
 [/thoracic vertebra/,"esq",["Vertebre toraciche","Sostengono il torace e si articolano con le costole.","12 vertebre.","Arterie intercostali; nervi toracici.","Cifosi, scoliosi, fratture da osteoporosi."],["Thoracic vertebrae","Support the chest and join the ribs.","12 vertebrae.","Intercostal arteries; thoracic nerves.","Kyphosis, scoliosis, osteoporotic fractures."]],
 [/lumbar vertebra/,"esq",["Vertebre lombari","Portano gran parte del peso del corpo; sono le vertebre più grandi.","5 vertebre.","Arterie lombari; nervi lombari.","Lombalgia, ernia del disco (spesso L4–L5 o L5–S1)."],["Lumbar vertebrae","Carry most of the body’s weight; the largest vertebrae.","5 vertebrae.","Lumbar arteries; lumbar nerves.","Low back pain, disc herniation (often L4–L5 or L5–S1)."]],
 [/intervertebral|disc/,"esq",["Disco intervertebrale","Cuscinetto tra le vertebre che assorbe gli urti.","Anello fibroso esterno e nucleo gelatinoso interno.","Nutrito per diffusione (quasi senza vasi).","Ernia del disco, degenerazione."],["Intervertebral disc","Shock-absorbing cushion between vertebrae.","Tough outer ring and jelly-like core.","Fed by diffusion (almost no vessels).","Disc herniation, degeneration."]],
 [/sacrum|coccyx/,"esq",["Sacro e coccige","Collegano la colonna al bacino.","Sacro: 5 vertebre fuse; coccige: 3–5.","Arterie sacrali.","Coccigodinia, dolore sacroiliaco."],["Sacrum and coccyx","Connect the spine to the pelvis.","Sacrum: 5 fused vertebrae; coccyx: 3–5.","Sacral arteries.","Tailbone pain, sacroiliac pain."]],
 [/costal cartilage/,"esq",["Cartilagine costale","Collega le costole allo sterno e rende elastica la gabbia toracica.","—","—","Costocondrite."],["Costal cartilage","Joins the ribs to the breastbone and makes the rib cage flexible.","—","—","Costochondritis."]],
 [/rib/,"esq",["Costola","Protegge cuore e polmoni e si muove con il respiro.","12 paia: 7 vere, 3 false, 2 fluttuanti.","Arterie e nervi intercostali.","Fratture costali."],["Rib","Protects the heart and lungs and moves with breathing.","12 pairs: 7 true, 3 false, 2 floating.","Intercostal arteries and nerves.","Rib fractures."]],
 [/sternum|manubrium|xiphoid/,"esq",["Sterno","Al centro del petto: unisce le costole e protegge il cuore.","Lungo circa 15–17 cm: manubrio, corpo, processo xifoideo.","Arterie toraciche interne.","Fratture da trauma."],["Sternum","In the middle of the chest: joins the ribs and shields the heart.","About 15–17 cm long: manubrium, body, xiphoid.","Internal thoracic arteries.","Fractures from trauma."]],
 [/clavicle/,"esq",["Clavicola","Collega il braccio al tronco e tiene la spalla in posizione.","Lunga circa 15 cm, a forma di S.","Arteria succlavia passa sotto.","Una delle ossa che si fratturano più spesso."],["Clavicle","Links the arm to the trunk and holds the shoulder out.","About 15 cm long, S-shaped.","The subclavian artery passes beneath.","One of the most often broken bones."]],
 [/scapula/,"esq",["Scapola","La base mobile della spalla, su cui si attaccano 17 muscoli.","Osso piatto triangolare sulla schiena.","Arterie soprascapolare e circonflessa.","Fratture rare, discinesia scapolare."],["Scapula","The mobile base of the shoulder, where 17 muscles attach.","Flat triangular bone on the back.","Suprascapular and circumflex arteries.","Rare fractures, scapular dyskinesis."]],
 [/humerus/,"esq",["Omero","L’osso del braccio, dalla spalla al gomito.","Lungo circa 30–35 cm nell’adulto.","Arteria brachiale; il nervo radiale gira attorno all’osso.","Fratture del collo dell’omero negli anziani."],["Humerus","The upper arm bone, from shoulder to elbow.","About 30–35 cm long in adults.","Brachial artery; the radial nerve winds around the bone.","Fractures of the humeral neck in older people."]],
 [/radius|ulna/,"esq",["Radio e ulna","Le due ossa dell’avambraccio; ruotando l’una sull’altra girano il palmo.","Lunghe circa 25 cm.","Arterie radiale e ulnare.","Frattura del polso (radio distale), tra le più comuni."],["Radius and ulna","The two forearm bones; rotating around each other they turn the palm.","About 25 cm long.","Radial and ulnar arteries.","Wrist fracture (distal radius), among the most common."]],
 [/metacarpal|phalanx of .*(finger|thumb)|scaphoid|lunate|triquetr|pisiform|trapezium|trapezoid|capitate|hamate/,"esq",["Ossa della mano","Danno alla mano forza e precisione.","27 ossa: 8 del carpo, 5 metacarpi, 14 falangi.","Arcate palmari; nervi mediano, ulnare, radiale.","Frattura dello scafoide, tunnel carpale, artrosi."],["Hand bones","Give the hand strength and precision.","27 bones: 8 carpals, 5 metacarpals, 14 phalanges.","Palmar arches; median, ulnar and radial nerves.","Scaphoid fracture, carpal tunnel, arthritis."]],
 [/hip bone|ilium|ischium|pubis|pubic/,"esq",["Osso dell’anca","Forma il bacino con il sacro: sostiene il tronco e protegge gli organi pelvici.","Tre ossa fuse: ileo, ischio, pube.","Arterie iliache.","Fratture del bacino, artrosi dell’anca."],["Hip bone","Forms the pelvis with the sacrum: supports the trunk and shields the pelvic organs.","Three fused bones: ilium, ischium, pubis.","Iliac arteries.","Pelvic fractures, hip arthritis."]],
 [/femur/,"esq",["Femore","L’osso più lungo e robusto del corpo.","Circa un quarto dell’altezza (in media 45 cm).","Arteria femorale profonda.","Frattura del collo del femore negli anziani."],["Femur","The longest and strongest bone in the body.","About a quarter of body height (about 45 cm on average).","Deep femoral artery.","Hip (femoral neck) fracture in older people."]],
 [/patella/,"esq",["Rotula","Protegge il ginocchio e aumenta la leva del quadricipite.","Il più grande osso sesamoide.","Rete arteriosa del ginocchio.","Dolore femoro-rotuleo, lussazione."],["Patella","Shields the knee and improves the quadriceps’ leverage.","The largest sesamoid bone.","Knee arterial network.","Patellofemoral pain, dislocation."]],
 [/tibia/,"esq",["Tibia","Porta il peso del corpo dal ginocchio alla caviglia: lo “stinco”.","Lunga circa 36–40 cm.","Arterie tibiali.","Fratture, periostite (shin splints)."],["Tibia","Carries body weight from knee to ankle: the shin bone.","About 36–40 cm long.","Tibial arteries.","Fractures, shin splints."]],
 [/fibula/,"esq",["Perone","Osso sottile della gamba: stabilizza la caviglia e porta poco peso.","Circa il 10–15% del carico della gamba.","Arteria peroniera.","Fratture della caviglia."],["Fibula","Slim leg bone: steadies the ankle and carries little weight.","About 10–15% of the leg’s load.","Fibular artery.","Ankle fractures."]],
 [/talus|calcaneus|navicular|cuboid|cuneiform|metatarsal|phalanx of .*toe|sesamoid/,"esq",["Ossa del piede","Sostengono il peso e funzionano da leva e ammortizzatore nel cammino.","26 ossa per piede.","Arterie dorsale del piede e plantari.","Fascite plantare, alluce valgo, fratture da stress."],["Foot bones","Bear weight and act as lever and shock absorber when walking.","26 bones in each foot.","Dorsalis pedis and plantar arteries.","Plantar fasciitis, bunion, stress fractures."]],
 [/bone|vertebra|cartilage/,"esq",["Osso","Sostiene il corpo, protegge gli organi, produce le cellule del sangue nel midollo.","Lo scheletro adulto ha 206 ossa.","—","Fratture, osteoporosi."],["Bone","Supports the body, protects organs and makes blood cells in the marrow.","The adult skeleton has 206 bones.","—","Fractures, osteoporosis."]]

  for (const s of [0,1]){
    const el=q["el"+s], fe=q["fe"+s], hz=q["hz"+s], fk=q["fk"+s], fh=q["fh"+s];
    set("deltoid",s, 0.95*Math.sin(Math.min(el,Math.PI/2)) + (el>Math.PI/2?0.25:0) + 0.35*Math.max(0,V("el"+s)));
    set("trap",s, 0.8*Math.max(0,(el-1.3)/1.2) + 0.2*Math.sin(Math.min(el,Math.PI/2)));
    set("pecs",s, 0.55*Math.max(0,q["fw"+s])*Math.sin(Math.min(el,Math.PI/2)) + 0.45*Math.max(0,-V("el"+s)));
    set("lats",s, 0.6*Math.max(0,-V("el"+s)));
    const bi=0.65*hz*(fe>0.4?1:0.45) + 0.45*Math.max(0,V("fe"+s)); set("biceps",s, bi);
    set("triceps",s, 0.55*Math.max(0,-V("fe"+s)) + (el>2.0?0.4*Math.sin(Math.min(fe,Math.PI/2)):0));
    set("fFlex",s, 0.35*bi); set("fExt",s, 0.25*hz);
    const load=q["seat"+s] ? 0.12 : 1;   /* seated: the chair carries the weight */
    const qd=1.05*Math.sin(Math.min(fk,1.57))*load + 0.25*Math.abs(V("fk"+s)); set("quads",s, qd);
    const gl=0.6*Math.sin(Math.min(fh,1.57))*load + 0.55*Math.max(0,-V("fh"+s)); set("glutes",s, gl);
    set("hams",s, 0.45*Math.max(0,V("fk"+s)) + 0.35*gl + 0.35*Math.sin(Math.min(q.tf,1.2)));
    set("hipFlex",s, 0.5*Math.max(0,V("fh"+s)) + 0.9*cl01(q["lift"+s]/0.15)*(q["seat"+s]?0.3:1));
    set("add",s, 0.25*qd);
    set("calf",s, (q["hr"+s]-0.015)/0.04 + 0.2*qd);
    set("tibAnt",s, (-q["hr"+s]-0.015)/0.03);
    set("scm",s, 0.9*Math.max(0,(s===1?1:-1)*q.yaw) + 0.3*Math.abs(V("yaw")));
    set("obliq",s, 0.5*Math.abs(V("rot")) + 0.7*Math.abs(q.rot));
    set("abs",s, 0.7*Math.max(0,V("tf")));
    set("erector",s, 0.9*Math.sin(Math.min(q.tf,1.2)) + 0.5*Math.max(0,-V("tf")));
  }
  for (let i=0;i<40;i++){ const t=cl01((a[i]-0.08)/0.92); ACT.sm[i]+= (t-ACT.sm[i])*0.25; }
  return ACT.sm;
}
function renderActPanel(act){
  const box=$("#actP"); if (!act){ box.hidden=true; return; }
  const names=E3.MG, list=[];
  for (let i=1;i<40;i++){ if (act[i]<0.15) continue; const k=Math.floor((i-1)/2), side=(i-1)%2; const nm=MGN[names[k]]; if (!nm) continue; list.push({ v:act[i], t:`${nm[S.lang==="it"?0:1]} (${side? T[S.lang].rightS : T[S.lang].leftS})` }); }
  list.sort((p,q)=>q.v-p.v);
  if (!list.length){ box.hidden=true; return; }
  $("#actL").innerHTML = list.slice(0,5).map(e=>`<div class="arow"><span>${esc(e.t)}</span><b style="--w:${Math.round(e.v*100)}%"></b><i>${Math.round(e.v*100)}%</i></div>`).join("");
  box.hidden=false;
}

/* ---------- detection loop ---------- */
let models={ pose:null, hands:null, face:null }, lastVT=-1, frameN=0, otherN=0, detN=0, fpsT=performance.now(), fps=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(), t=now/1000;
  if (video.readyState>=2 && video.currentTime!==lastVT){
    lastVT=video.currentTime;
    const L=S.layers;
    const wantHands = models.hands && (L.hands || (S.reveal==="lens" && S.follow==="finger"));
    const wantFace = !!models.face; // always on: it also confirms that a detected body is a real person
    let task = "pose";
    if (frameN%2===1 || !models.pose){
      if (wantHands && wantFace) task = (otherN++%2===0) ? "face" : "hands";
      else if (wantFace) task="face"; else if (wantHands) task="hands";
    }
    try {
      if (task==="pose" && models.pose) onPose(models.pose.detectForVideo(video,now),t);
      else if (task==="face") onFace(models.face.detectForVideo(video,now),t);
      else if (task==="hands") onHands(models.hands.detectForVideo(video,now),t);
    } catch(e){ console.warn(e); }
    frameN++; detN++;
    if (TR.face.tracked) SK.lastFace=now;
    if (L.skin && TR.face.tracked && now-SK.last>180){ SK.last=now; try { analyzeSkin(); } catch(e){ console.warn(e); } }
    if (FSK && now-SK.lastFace>2500 && SK.lastFace) { FSK.reset(); SK.lastFace=0; }
  }
  if (now-fpsT>1000){ fps=Math.round(detN*1000/(now-fpsT)); detN=0; fpsT=now; updateStatus(); }
  if (S.view==="3d") render3d(now); else render(now);
}

/* ---------- camera + models ---------- */
let stream=null, fileset=null;
async function startCamera(){
  if (stream) stream.getTracks().forEach(tr=>tr.stop());
  stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:S.facing, width:{ideal:1280}, height:{ideal:720} } });
  video.srcObject = stream; await video.play();
}
async function make(Cls,url,extra){
  try { return await Cls.createFromOptions(fileset,{ baseOptions:{ modelAssetPath:url, delegate:"GPU" }, runningMode:"VIDEO", ...extra }); }
  catch(e){ return await Cls.createFromOptions(fileset,{ baseOptions:{ modelAssetPath:url, delegate:"CPU" }, runningMode:"VIDEO", ...extra }); }
}
const POSE_OPTS = { numPoses:1, minPoseDetectionConfidence:0.7, minPosePresenceConfidence:0.7, minTrackingConfidence:0.65 };
async function loadPose(){
  const old=models.pose; models.pose=null; if (old) try { old.close(); } catch(e){}
  models.pose = await make(PoseLandmarker, POSE_URL[S.quality], POSE_OPTS);
}
async function loadModels(){
  fileset = await FilesetResolver.forVisionTasks(MP_BASE);
  await loadPose(); updateStatus();
  const [h,f] = await Promise.allSettled([
    make(HandLandmarker, HAND_URL, { numHands:2, minHandDetectionConfidence:0.7, minHandPresenceConfidence:0.7, minTrackingConfidence:0.6 }),
    make(FaceLandmarker, FACE_URL, { numFaces:1, minFaceDetectionConfidence:0.6, minFacePresenceConfidence:0.6, minTrackingConfidence:0.6, outputFaceBlendshapes:false })
  ]);
  if (h.status==="fulfilled") models.hands=h.value; else console.warn(h.reason);
  if (f.status==="fulfilled") models.face=f.value; else console.warn(f.reason);
}
function updateStatus(){
  const tx=T[S.lang]; let msg, ok=false;
  if (S.view==="3d"){
    if (performance.now() < noteUntil){ $("#stext").textContent=tx.packMissing; $("#sdot").classList.remove("ok"); return; }
    if (!E3) msg = loadPct ? `${tx.load3d} ${Math.round(loadPct*100)}%` : tx.load3d;
    else if (E3.real && (S.section==="mri" || S.section==="cut")){ const ci=E3.cutInfo(); msg=`${S.section==="mri"?tx.sMri:tx.sCut} · ${tx[{axial:"pAx",coronal:"pCor",sagittal:"pSag"}[ci.plane]]} · ${ci.mm>0?"+":""}${ci.mm} mm`; ok=true; }
    else if (S.pose3d==="freeze"){ msg=tx.s3dFrozen; ok=true; }
    else if (TR.pose.tracked){ msg=`${tx.s3dLive} · ${fps} fps`; ok=true; }
    else msg = stream ? tx.looking : tx.s3dDemo;
    $("#stext").textContent=msg; $("#sdot").classList.toggle("ok",ok); return;
  }
  if (!models.pose) msg=tx.loading;
  else if (TR.pose.tracked){ msg=`${tx.tracking} · ${fps} fps`; ok=true; }
  else if (TR.face.tracked){ msg=`${tx.faceOnly} · ${fps} fps`; ok=true; }
  else msg=tx.looking;
  $("#stext").textContent=msg; $("#sdot").classList.toggle("ok",ok);
}

$("#go").addEventListener("click", async ()=>{
  const btn=$("#go"); btn.disabled=true; btn.textContent=T[S.lang].starting; $("#err").textContent="";
  const cam=startCamera(), mdl=loadModels();
  try { await cam; } catch(e){ btn.disabled=false; applyLang(); $("#err").textContent=T[S.lang].camErr; return; }
  $("#start").hidden=true; $("#status").hidden=false; updateStatus();
  startLoop();
  try { await mdl; updateStatus(); } catch(e){ console.error(e); $("#stext").textContent=T[S.lang].modelErr; }
});
let looping=false;
function startLoop(){ if (!looping){ looping=true; requestAnimationFrame(loop); } }
$("#go3d").addEventListener("click", async ()=>{ $("#start").hidden=true; $("#status").hidden=false; await setView("3d"); startLoop(); });
$("#v3d").addEventListener("click", ()=>{ setView(S.view==="3d" ? "ar" : "3d"); });

/* ---------- UI ---------- */
function applyLang(){
  const tx=T[S.lang]; document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-i]").forEach(el=>{ if (tx[el.dataset.i]) el.textContent=tx[el.dataset.i]; });
  for (const b of [$("#lang"),$("#lang2")]) b.textContent = S.lang==="it" ? "EN" : "IT";
  document.title=tx.title; if (models.pose) updateStatus();
}
function syncUI(){
  saveSettings();
  document.querySelectorAll("[data-layer]").forEach(el=>{ el.checked=!!S.layers[el.dataset.layer]; });
  document.querySelectorAll("[data-seg]").forEach(seg=>{ seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", S[seg.dataset.seg]===b.dataset.v)); });
  document.querySelectorAll("[data-preset]").forEach(b=>{ const p=PRESETS[b.dataset.preset]; b.classList.toggle("on", Object.keys(p).every(k=>!!p[k]===!!S.layers[k])); });
  $("#v3d").textContent = S.view==="3d" ? "AR" : "3D"; $("#v3d").classList.toggle("on", S.view==="3d");
  $("#slice").value=Math.round(S.slices[S.plane]*1000);
  document.body.classList.toggle("secview", S.section==="mri" || S.section==="cut");
  document.body.classList.toggle("hud", S.theme==="hud");
  if (typeof updateStatus==="function" && S.view==="3d") try { updateStatus(); } catch(e){}
  $("#real").value=Math.round(S.real*100); $("#brightness").value=Math.round(S.brightness*100);
  $("#lensSize").value=Math.round(S.lensSize*100); $("#zoom").value=Math.round(S.zoom*10);
}
document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{ const p=PRESETS[b.dataset.preset]; for (const k in p) S.layers[k]=!!p[k]; LST.clear(); syncUI(); }));
document.querySelectorAll("[data-layer]").forEach(el=>el.addEventListener("change",()=>{ S.layers[el.dataset.layer]=el.checked; syncUI(); }));
document.querySelectorAll("[data-seg]").forEach(seg=>seg.addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if (!b) return;
  const key=seg.dataset.seg, prev=S[key]; S[key]=b.dataset.v; syncUI();
  if (key==="reveal" || key==="density") LST.clear();
  if (E3 && key==="focus") E3.setFocus(S.focus);
  if (E3 && key==="spin") E3.setSpin(S.spin==="on");
  if (key==="pose3d" || key==="section" || key==="plane") updateStatus();
  if (key==="plane") $("#slice").value=Math.round(S.slices[S.plane]*1000);
  if (key==="section"){ LST.clear(); closeCard(); }
  if (key==="quality" && prev!==S.quality && fileset){ updateStatus(); loadPose().then(updateStatus).catch(console.error); }
}));
$("#real").addEventListener("input",e=>{ S.real=e.target.value/100; saveSettings(); });
$("#brightness").addEventListener("input",e=>{ S.brightness=e.target.value/100; saveSettings(); });
$("#lensSize").addEventListener("input",e=>{ S.lensSize=e.target.value/100; saveSettings(); });
$("#zoom").addEventListener("input",e=>{ S.zoom=e.target.value/10; saveSettings(); });
$("#slice").addEventListener("input",e=>{ S.slices[S.plane]=e.target.value/1000; saveSettings(); updateStatus(); });
$("#more").addEventListener("click",()=>{ const open=$("#sheet").classList.toggle("open"); $("#more").setAttribute("aria-expanded",String(open)); });
for (const b of [$("#lang"),$("#lang2")]) b.addEventListener("click",()=>{ S.lang = S.lang==="it" ? "en" : "it"; applyLang(); saveSettings(); if (cardSel) showCard(cardSel); });
$("#cardX").addEventListener("click", closeCard);
$("#flip").addEventListener("click", async ()=>{
  S.facing = S.facing==="user" ? "environment" : "user";
  for (const tr of [TR.pose, TR.face, ...TR.hands]){ tr.tracked=false; tr.lm=null; tr.good=0; tr.fade=0; }
  lensCur=null; LST.clear(); if (FSK) FSK.reset();
  try { await startCamera(); } catch(e){ $("#stext").textContent=T[S.lang].camErr; }
});
$("#snap").addEventListener("click",()=>{
  const f=$("#flash"); f.classList.add("on"); setTimeout(()=>f.classList.remove("on"),60);
  let src = canvas;
  if (S.view==="3d" && E3){ src=document.createElement("canvas"); src.width=canvas.width; src.height=canvas.height; const x=src.getContext("2d");
    x.fillStyle="#061019"; x.fillRect(0,0,src.width,src.height); x.drawImage($("#gl"),0,0,src.width,src.height); x.drawImage(canvas,0,0); }
  src.toBlob(async (blob)=>{
    if (!blob) return;
    const file=new File([blob],"anatomy-lens.png",{ type:"image/png" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ try { await navigator.share({ files:[file], title:T[S.lang].title }); return; } catch(e){} }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="anatomy-lens.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },"image/png");
});
let dragging=false;
canvas.addEventListener("pointerdown",e=>{ if (S.view==="3d" && E3){ canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); clearTimeout(tapTimer); tapStart={ x:e.clientX, y:e.clientY, t:performance.now(), id:e.pointerId, n:(tapStart&&tapStart.down||0) }; E3.pointerDown(e); return; } dragging=true; S.touch={ x:e.clientX, y:e.clientY }; });
canvas.addEventListener("pointermove",e=>{ if (S.view==="3d" && E3){ E3.pointerMove(e); return; } if (dragging) S.touch={ x:e.clientX, y:e.clientY }; });
window.addEventListener("pointerup",e=>{ dragging=false; if (E3) E3.pointerUp(e);
  if (S.view==="3d" && E3 && tapStart && tapStart.id===e.pointerId){ const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y), dtp=performance.now()-tapStart.t, x=e.clientX, y=e.clientY;
    if (moved<9 && dtp<320){ clearTimeout(tapTimer); tapTimer=setTimeout(()=>doPick(x,y),280); } tapStart=null; } });
window.addEventListener("pointercancel",e=>{ dragging=false; if (E3) E3.pointerUp(e); });
canvas.addEventListener("wheel",e=>{ if (S.view==="3d" && E3){ e.preventDefault(); E3.wheel(e); } },{ passive:false });

applyLang(); syncUI();


</script>
